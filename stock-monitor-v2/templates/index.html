<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        // 【强制防缓存】如果URL没有随机参数，立即跳转加参数
        if (!location.search.includes('_=')) {
            location.href = location.pathname + '?_=' + Date.now();
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>股票投资监控系统 v2.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ now }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ib-analysis.css') }}?v={{ now }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 【终极清除】动态改写所有脚本URL，强制加载最新
        (function() {
            const CACHE_BUSTER = Date.now();
            
            // 1. 注销 Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    regs.forEach(reg => reg.unregister());
                });
            }
            
            // 2. 清理 caches API
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            
            // 3. 版本检测 - 变化则强制刷新
            const APP_VERSION = '20250409-fix';
            const storedVersion = localStorage.getItem('app_version');
            
            if (storedVersion !== APP_VERSION) {
                console.log('[Cache] 版本更新:', storedVersion, '->', APP_VERSION);
                localStorage.clear();
                sessionStorage.clear();
                localStorage.setItem('app_version', APP_VERSION);
                window.location.href = window.location.pathname + '?_=' + CACHE_BUSTER;
                return;
            }
        })();
    </script>
</head>
<body>
    <!-- 【内联紧急数据加载】确保即使JS被缓存也能显示数据 -->
    <script>
        (function() {
            console.log('[Emergency] 开始紧急数据加载...');
            window.appState = window.appState || {};
            window.appState.stocks = [];
            
            fetch('/api/stocks', { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    console.log('[Emergency] API返回:', Array.isArray(data) ? data.length + '只' : typeof data);
                    if (Array.isArray(data) && data.length > 0) {
                        window.appState.stocks = data.map(s => ({
                            id: s.id, code: s.code, name: s.name,
                            market: s.market || 'A股', price: s.current_price || 0,
                            holdCost: s.avg_cost || 0, holdQuantity: s.shares || 0
                        }));
                        localStorage.setItem('import_data_last', JSON.stringify(window.appState.stocks));
                        console.log('[Emergency] 数据已加载:', window.appState.stocks.length);
                        
                        // 【关键】立即触发渲染 - 直接操作DOM，不依赖外部JS
                        setTimeout(function() {
                            const listEl = document.getElementById('stockList');
                            if (listEl && window.appState.stocks.length > 0) {
                                console.log('[Emergency] 直接渲染持仓列表:', window.appState.stocks.length);
                                listEl.innerHTML = '';
                                window.appState.stocks.forEach((stock, index) => {
                                    const item = document.createElement('div');
                                    item.className = 'stock-item' + (index === 0 ? ' active' : '');
                                    item.innerHTML = `
                                        <div class="stock-info" style="flex: 1.5; text-align: left;">
                                            <span class="code" style="font-weight: 600; font-size: 0.875rem; color: #e8eaed;">${stock.code}</span>
                                            <span class="name" style="font-size: 0.75rem; color: #9ca3af; display: block;">${stock.name}</span>
                                        </div>
                                        <div class="stock-price" style="flex: 1; text-align: right; font-weight: 600;">
                                            ${stock.price.toFixed(2)}
                                        </div>
                                        <div class="stock-pnl" style="flex: 1; text-align: right; font-size: 0.75rem; color: #e8eaed;">
                                            ${stock.holdQuantity}股
                                        </div>
                                    `;
                                    listEl.appendChild(item);
                                });
                            }
                        }, 100);
                    }
                })
                .catch(e => console.error('[Emergency] 加载失败:', e));
        })();
    </script>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>股票投资监控系统</span>
                <span class="version">v2.0</span>
            </div>
        </div>
        <div class="header-center">
            <div class="market-status">
                <span class="status-dot" id="marketStatusDot"></span>
                <span id="marketStatusText">加载中...</span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-header" onclick="showDataImportModal()">
                <i class="fas fa-file-import"></i>
                <span>数据导入</span>
            </button>
            <button class="btn-header" onclick="showAnalysisModal()">
                <i class="fas fa-chart-pie"></i>
                <span>数据分析</span>
            </button>
            <button class="btn-header" onclick="refreshAxisPrices(true)" title="重新计算中轴价格（强制刷新）">
                <i class="fas fa-sync-alt"></i>
                <span>刷新中轴</span>
            </button>
            <button class="btn-header" onclick="forceReset()" title="清除缓存并重新加载">
                <i class="fas fa-redo"></i>
                <span>强制重置</span>
            </button>
            <div class="current-time" id="currentTime"></div>
            <button class="btn-icon" title="设置">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- 顶部资产总览 -->
    <section class="asset-overview">
        <div class="asset-card total">
            <div class="asset-icon">
                <i class="fas fa-wallet"></i>
            </div>
            <div class="asset-info">
                <div class="asset-label">总资产</div>
                <div class="asset-value" id="totalAssets">--</div>
            </div>
        </div>
        <div class="asset-card position">
            <div class="asset-icon">
                <i class="fas fa-chart-pie"></i>
            </div>
            <div class="asset-info">
                <div class="asset-label">持仓市值</div>
                <div class="asset-value" id="totalPosition">--</div>
            </div>
        </div>
        <div class="asset-card cash">
            <div class="asset-icon">
                <i class="fas fa-coins"></i>
            </div>
            <div class="asset-info">
                <div class="asset-label">可用资金</div>
                <div class="asset-value" id="availableCash">--</div>
            </div>
        </div>
        <div class="asset-card pnl" id="todayPnLCards">
            <div class="asset-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="asset-info">
                <div class="asset-label">今日盈亏</div>
                <div class="asset-value" id="todayPnL">--</div>
            </div>
        </div>
    </section>

    <!-- 主内容区域 -->
    <div class="main-container">
        <!-- 左侧持仓列表 -->
        <aside class="sidebar-left">
            <div class="panel stocks-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-list"></i> 持仓列表</h3>
                    <div class="header-actions">
                        <button class="btn-icon" onclick="refreshStockPrices(true)" title="刷新价格">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="btn-icon" onclick="showAddStockModal()" title="添加股票">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="stock-list" id="stockList">
                        <!-- 持仓列表将由紧急脚本渲染 -->
                    </div>
                </div>
            </div>
            
            <!-- 资金流向分析模块 -->
            <div class="panel capital-flow-panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <h3><i class="fas fa-exchange-alt"></i> 资金流向分析</h3>
                </div>
                <div class="panel-body">
                    <div id="capitalFlowContent" style="padding: 12px;">
                        <div style="text-align: center; color: #6b7280; padding: 20px;">
                            加载中...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 国际市场观点 -->
            <div class="panel ib-analysis-panel" id="ibAnalysisPanel" style="margin-top: 16px;">
                <div class="panel-header" onclick="toggleIBPanel()">
                    <h3><i class="fas fa-globe"></i> 国际投行观点</h3>
                    <i class="fas fa-chevron-down toggle-icon" id="ibToggleIcon"></i>
                </div>
                <div class="panel-body" id="ibAnalysisContent" style="max-height: 400px; overflow-y: auto;">
                    <div style="padding: 12px; text-align: center; color: #6b7280;">
                        正在加载国际投行分析...
                    </div>
                </div>
            </div>
        </aside>

        <!-- 中间内容区域 -->
        <main class="main-content">
            <!-- 股票详情 -->
            <div class="panel stock-detail-panel" id="stockDetailPanel">
                <div class="panel-header">
                    <h3><i class="fas fa-chart-area"></i> 股票详情</h3>
                    <div class="header-actions">
                        <button class="btn-icon" onclick="refreshCurrentStockData()" title="刷新数据">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="stockDetail">
                        <div style="text-align: center; color: #6b7280; padding: 40px;">
                            请选择一只股票查看详情
                        </div>
                    </div>
                </div>
            </div>

            <!-- 策略执行情况 -->
            <div class="panel strategy-panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <h3><i class="fas fa-chess-knight"></i> 策略执行追踪</h3>
                    <span class="badge" id="strategyBadge">监控中</span>
                </div>
                <div class="panel-body">
                    <div id="strategyExecution">
                        <div class="strategy-status">
                            <div class="status-item">
                                <span class="label">策略模式：</span>
                                <span class="value" id="currentStrategy">--</span>
                            </div>
                            <div class="status-item">
                                <span class="label">执行状态：</span>
                                <span class="value" id="executionStatus">--</span>
                            </div>
                            <div class="status-item">
                                <span class="label">上次交易：</span>
                                <span class="value" id="lastTrade">--</span>
                            </div>
                        </div>
                        <div class="action-buttons" style="margin-top: 12px; display: flex; gap: 8px;">
                            <button class="btn btn-primary" onclick="executeBuy()">
                                <i class="fas fa-arrow-down"></i> 执行买入
                            </button>
                            <button class="btn btn-danger" onclick="executeSell()">
                                <i class="fas fa-arrow-up"></i> 执行卖出
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 右侧面板 -->
        <aside class="sidebar-right">
            <!-- 市场情绪 -->
            <div class="panel sentiment-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-heartbeat"></i> 市场情绪</h3>
                </div>
                <div class="panel-body">
                    <div id="marketSentiment">
                        <div style="text-align: center; color: #6b7280; padding: 20px;">
                            加载中...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 实时新闻 -->
            <div class="panel news-panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <h3><i class="fas fa-newspaper"></i> 实时新闻</h3>
                    <button class="btn-icon" onclick="loadNews()" title="刷新新闻">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="panel-body">
                    <div class="news-list" id="newsList">
                        <div style="text-align: center; color: #6b7280; padding: 20px;">
                            加载中...
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 添加股票弹窗 -->
    <div class="modal" id="addStockModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加股票</h3>
                <button class="btn-close" onclick="closeAddStockModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addStockForm">
                    <div class="form-group">
                        <label>股票代码</label>
                        <input type="text" id="stockCode" placeholder="例如：000001" required>
                    </div>
                    <div class="form-group">
                        <label>股票名称</label>
                        <input type="text" id="stockName" placeholder="例如：平安银行" required>
                    </div>
                    <div class="form-group">
                        <label>市场类型</label>
                        <select id="stockMarket">
                            <option value="A股">A股</option>
                            <option value="港股">港股</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>持仓成本</label>
                        <input type="number" id="holdCost" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>持仓数量</label>
                        <input type="number" id="holdQuantity" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>当前价格</label>
                        <input type="number" id="currentPrice" step="0.01" placeholder="自动获取">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeAddStockModal()">取消</button>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 数据分析弹窗 -->
    <div class="modal" id="analysisModal">
        <div class="modal-content" style="width: 90%; max-width: 1200px;">
            <div class="modal-header">
                <h3>投资组合分析</h3>
                <button class="btn-close" onclick="closeAnalysisModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="analysis-grid">
                    <div class="analysis-card">
                        <h4>资产配置</h4>
                        <canvas id="allocationChart"></canvas>
                    </div>
                    <div class="analysis-card">
                        <h4>风险分析</h4>
                        <div id="riskAnalysis"></div>
                    </div>
                    <div class="analysis-card">
                        <h4>收益分析</h4>
                        <div id="returnAnalysis"></div>
                    </div>
                    <div class="analysis-card">
                        <h4>策略效果</h4>
                        <div id="strategyAnalysis"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据导入弹窗 -->
    <div class="modal" id="dataImportModal">
        <div class="modal-content" style="width: 90%; max-width: 800px;">
            <div class="modal-header">
                <h3>数据导入</h3>
                <button class="btn-close" onclick="closeDataImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="import-tabs">
                    <button class="tab-btn active" onclick="switchImportTab('upload')">文件上传</button>
                    <button class="tab-btn" onclick="switchImportTab('manual')">手动录入</button>
                    <button class="tab-btn" onclick="switchImportTab('history')">导入历史</button>
                </div>
                
                <div class="tab-content active" id="uploadTab">
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <p>拖拽文件到此处，或点击上传</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">支持 .txt、.csv、.xls、.xlsx 格式</p>
                        <input type="file" id="fileInput" accept=".txt,.csv,.xls,.xlsx" style="display: none;">
                    </div>
                    <div class="file-preview" id="filePreview" style="display: none;">
                        <div class="preview-header">
                            <span id="previewFileName"></span>
                            <button class="btn-text" onclick="resetFileUpload()">重新选择</button>
                        </div>
                        <table class="preview-table" id="previewTable"></table>
                        <div class="preview-stats" id="previewStats"></div>
                        <button class="btn btn-primary" onclick="confirmImport()" id="confirmImportBtn" disabled>
                            确认导入
                        </button>
                    </div>
                    <div class="import-template" style="margin-top: 16px;">
                        <p style="font-size: 12px; color: var(--text-muted);">
                            没有模板？<a href="#" onclick="downloadTemplate()">下载导入模板</a>
                        </p>
                    </div>
                </div>
                
                <div class="tab-content" id="manualTab">
                    <div class="manual-input-area">
                        <textarea id="manualDataInput" placeholder="请输入股票数据，格式：&#10;代码 名称 市场 持仓 成本价 现价&#10;&#10;例如：&#10;000001 平安银行 A股 1000 10.50 11.20&#10;00700 腾讯控股 港股 500 380.00 395.50"></textarea>
                        <div class="manual-actions" style="margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end;">
                            <button class="btn btn-secondary" onclick="clearManualData()">清空</button>
                            <button class="btn btn-primary" onclick="parseManualData()">解析数据</button>
                        </div>
                    </div>
                </div>
                
                <div class="tab-content" id="historyTab">
                    <div class="import-history" id="importHistoryList">
                        <!-- 导入历史列表 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/modules/utils.js') }}?v={{ now }}"></script>
    <script src="{{ url_for('static', filename='js/modules/api.js') }}?v={{ now }}"></script>
    <script src="{{ url_for('static', filename='js/modules/state.js') }}?v={{ now }}"></script>
    <script src="{{ url_for('static', filename='js/southbound.js') }}?v={{ now }}"></script>
    <script src="{{ url_for('static', filename='js/import.js') }}?v={{ now }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ now }}"></script>
</body>
</html>
