<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
</head>
<body>
    <h1>API 调试</h1>
    <div id="result">加载中...</div>
    <script>
        fetch('/api/stocks')
            .then(r => r.json())
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<pre>股票数量: ' + data.length + '\n' +
                    '第一只: ' + (data[0] ? data[0].name + ' (' + data[0].code + ')' : '无') + '\n' +
                    '数据: ' + JSON.stringify(data.slice(0,2), null, 2) + '</pre>';
            })
            .catch(e => {
                document.getElementById('result').innerHTML = '错误: ' + e.message;
            });
    </script>
</body>
</html>
